<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sweetie Assistant</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #121212;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      height: 100vh;
      padding: 20px;
    }
    #output {
      background: #1e1e1e;
      border-radius: 12px;
      padding: 20px;
      width: 90%;
      max-width: 600px;
      overflow-y: auto;
      height: 60vh;
      margin-bottom: 20px;
    }
    #start-btn {
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background-color: #ff69b4;
      color: #000;
      cursor: pointer;
      margin-bottom: 20px;
    }
    .message {
      margin: 10px 0;
    }
    .user {
      color: #0ff;
    }
    .pelo {
      color: #0f0;
    }
  </style>
</head>
<body>
  <h1>🎀 Sweetie - Voice Assistant</h1>
  <button id="start-btn">🎤 Start Listening</button>
  <div id="output"></div>

  <script>
    const output = document.getElementById("output");
    const startBtn = document.getElementById("start-btn");
    const synth = window.speechSynthesis;
    let voices = [];

    function populateVoices() {
      voices = synth.getVoices();
    }
    populateVoices();
    if (speechSynthesis.onvoiceschanged !== undefined) {
      speechSynthesis.onvoiceschanged = populateVoices;
    }

    const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    recognition.lang = 'en-US';
    recognition.interimResults = false;
    recognition.continuous = true;

    function addMessage(text, sender = 'user') {
      const div = document.createElement("div");
      div.className = `message ${sender}`;
      div.textContent = `${sender === 'user' ? '🧑' : '🤖'} ${text}`;
      output.appendChild(div);
      output.scrollTop = output.scrollHeight;
    }

    function speak(text) {
      const utterance = new SpeechSynthesisUtterance(text);
      const preferred = voices.find(v =>
        v.name.includes("Google UK English Female") || v.name.includes("Samantha") ||
        (v.name.includes("English") && v.name.toLowerCase().includes("female"))
      );
      if (preferred) utterance.voice = preferred;
      utterance.pitch = 1.2;
      utterance.rate = 0.95;
      synth.speak(utterance);
    }

    function respond(command) {
      command = command.toLowerCase();
      addMessage(command, 'user');

      if (command.includes("open google")) {
        speak("Opening Google");
        addMessage("Opening Google", 'pelo');
        window.open("https://www.google.com", "_blank");
      } else if (command.includes("what's the weather")) {
        getWeather();
      } else if (command.includes("open youtube")) {
        speak("Opening YouTube");
        addMessage("Opening YouTube", 'pelo');
        window.open("https://www.youtube.com", "_blank");
      } else if (command.includes("dark mode")) {
        document.body.style.backgroundColor = "#121212";
        document.body.style.color = "#ffffff";
        speak("Dark mode activated");
        addMessage("Dark mode activated", 'pelo');
      } else if (command.includes("light mode")) {
        document.body.style.backgroundColor = "#ffffff";
        document.body.style.color = "#000000";
        speak("Light mode activated");
        addMessage("Light mode activated", 'pelo');
      } else if (command.includes("tell me a joke")) {
        const joke = "Why don’t skeletons fight each other? Because they don’t have the guts.";
        speak(joke);
        addMessage(joke, 'pelo');
      } else {
        const reply = "I'm still learning. You said: " + command;
        speak(reply);
        addMessage(reply, 'pelo');
      }
    }

    async function getWeather() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(async pos => {
          const lat = pos.coords.latitude;
          const lon = pos.coords.longitude;
          const apiKey = 'your_openweathermap_api_key'; // Replace with your real key
          const url = `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&units=metric&appid=${apiKey}`;
          const res = await fetch(url);
          const data = await res.json();
          const desc = data.weather[0].description;
          const temp = data.main.temp;
          const city = data.name;
          const msg = `It is currently ${temp}°C with ${desc} in ${city}.`;
          speak(msg);
          addMessage(msg, 'pelo');
        });
      } else {
        speak("I can't get your location.");
        addMessage("I can't get your location.", 'pelo');
      }
    }

    window.onload = () => {
      speak("Hello, I'm Sweetie. Ready and listening for your commands.");
      recognition.start();
    };

    recognition.onresult = function(event) {
      const transcript = event.results[event.results.length - 1][0].transcript.toLowerCase();
      console.log("Heard:", transcript);
      respond(transcript);
    };

    startBtn.onclick = () => {
      recognition.start();
      speak("Listening started.");
    };
  </script>
</body>
</html>
