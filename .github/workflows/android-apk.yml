name: Android APK

on:
  push:
    branches: ['arena/5d24545f-pelo-lite']
    paths:
      - 'android/**'
      - 'public/**'
      - 'scripts/**'
      - 'package*.json'
      - 'capacitor.config.json'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build installable Android test APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - name: Install Android SDK packages
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          if ! sdkmanager 'platforms;android-36' 'build-tools;36.0.0' > sdk-install.log 2>&1; then
            tail -n 30 sdk-install.log | while IFS= read -r line; do printf '::error::%s\n' "$line"; done
            exit 1
          fi
          cat sdk-install.log
      - run: npm ci
      - run: npm test
      - run: npm run android:sync
      - name: Compile debug APK
        working-directory: android
        run: |
          if ! ./gradlew assembleDebug --no-daemon > gradle-build.log 2>&1; then
            tail -n 45 gradle-build.log | while IFS= read -r line; do printf '::error::%s\n' "$line"; done
            exit 1
          fi
          cat gradle-build.log
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: itutor-android-debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
